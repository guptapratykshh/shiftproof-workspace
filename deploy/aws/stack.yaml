AWSTemplateFormatVersion: '2010-09-09'
Description: ShiftProof production host with HTTPS, private evidence and recovery storage
Parameters:
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.medium, t3.large]
  EnvironmentParameter:
    Type: String
    Default: /shiftproof/production/environment
Resources:
  Network:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.44.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: shiftproof-production}]
  Gateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Network, InternetGatewayId: !Ref Gateway}
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Network
      CidrBlock: 10.44.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  Routes:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Network}
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref Routes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Gateway
  SubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref Subnet, RouteTableId: !Ref Routes}
  Firewall:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS and ACME only; administration uses SSM, never SSH
      VpcId: !Ref Network
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
  Storage:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
          - Id: old-object-versions
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
          - Id: database-backups
            Prefix: backups/
            Status: Enabled
            ExpirationInDays: 30
          - Id: old-releases
            Prefix: releases/
            Status: Enabled
            ExpirationInDays: 30
  StoragePolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Storage
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt Storage.Arn, !Sub '${Storage.Arn}/*']
            Condition: {Bool: {aws:SecureTransport: false}}
  Logs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties: {LogGroupName: !Sub '/shiftproof/${AWS::StackName}', RetentionInDays: 14}
  HostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]
      Policies:
        - PolicyName: shiftproof-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt Storage.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${Storage.Arn}/*'
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${EnvironmentParameter}'
              # Restrict the broader parameter read access in the SSM agent's
              # managed policy to this app's own environment parameter.
              - Effect: Deny
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                NotResource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${EnvironmentParameter}'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt Logs.Arn
  HostProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref HostRole]}
  Host:
    Type: AWS::EC2::Instance
    DependsOn: [InternetRoute, SubnetRoutes]
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref HostProfile
      MetadataOptions: {HttpTokens: required, HttpPutResponseHopLimit: 2, HttpEndpoint: enabled}
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref Subnet
          GroupSet: [!Ref Firewall]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeType: gp3, VolumeSize: 40, Encrypted: true, DeleteOnTermination: false}
      Tags: [{Key: Name, Value: shiftproof-production}]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -eu
          dnf install -y docker nginx python3.12 python3.12-pip amazon-cloudwatch-agent
          python3.12 -m venv /opt/certbot
          /opt/certbot/bin/pip install 'certbot>=5.4,<6'
          systemctl enable --now docker
          mkdir -p /opt/shiftproof /usr/local/lib/docker/cli-plugins
          chmod 700 /opt/shiftproof
          curl --fail --location --retry 3 https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod 755 /usr/local/lib/docker/cli-plugins/docker-compose
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
  Address:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties: {Domain: vpc, InstanceId: !Ref Host}
  SystemRecovery:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Recover the host after an underlying EC2 system failure
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions: [{Name: InstanceId, Value: !Ref Host}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Sub 'arn:aws:automate:${AWS::Region}:ec2:recover']
  HighCPU:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{Name: InstanceId, Value: !Ref Host}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
Outputs:
  URL: {Value: !Sub 'https://${Address}'}
  InstanceId: {Value: !Ref Host}
  Bucket: {Value: !Ref Storage}
  OutboundIP: {Value: !Ref Address}
  SecurityGroup: {Value: !Ref Firewall}
  VpcId: {Value: !Ref Network}
  LogGroup: {Value: !Ref Logs}
