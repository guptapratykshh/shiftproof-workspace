limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 26m;
    server_tokens off;
    client_body_timeout 30s;
    send_timeout 60s;
    limit_req_status 429;
    # AWS host nginx reaches the loopback-bound container through this gateway.
    set_real_ip_from 172.28.44.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location ~ ^/api/v1/auth/(login/|register|recover) {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
    location /api/ {
        limit_req zone=api burst=80 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 320s;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location = /sw.js { expires -1; }
    location = /theme.js { expires -1; }
    location ~ /\. { return 404; }
    location / { expires -1; try_files $uri $uri/ /index.html; }
}
