<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta name="description" content="Turn spoken updates into a handover people can trust. Keep unfinished work visible, review the evidence, and start the next shift with clarity." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ShiftProof — The next shift starts with clarity</title>
    <script>
      try {
        const stored = localStorage.getItem('shiftproof-theme');
        const preference = ['dark', 'light', 'system'].includes(stored) ? stored : 'light';
        document.documentElement.dataset.theme = preference === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
