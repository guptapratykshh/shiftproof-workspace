[project]
name = "shiftproof-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pymongo>=4.11,<5",
  "certifi>=2024.8",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.20",
  "email-validator>=2.2",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "openpyxl>=3.1,<4",
  "google-genai>=1.0,<3",
  "boto3>=1.35,<2",
  "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Model imports register and re-export the complete SQLAlchemy schema.
"app/models/__init__.py" = ["F401"]
